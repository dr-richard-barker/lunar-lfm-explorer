<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <!-- NASA-IBM Lunar Foundation Model Architecture Diagram -->
  <!-- Note: ABAI L018 compliant - uses direct color values instead of CSS var() for WebKit compatibility -->
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="grad-wac" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-nac" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="grad-enc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="grad-dec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="url(#grad-bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" fill="#ffffff" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" text-anchor="middle">
    NASA-IBM Lunar Foundation Model Architecture
  </text>
  <text x="450" y="60" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    Multimodal ViT-B (768-dim, 12 layers) with Explicit Geometry Tokens &amp; FlexiViT Resizing
  </text>

  <!-- Section 1: Inputs & Tokenizers -->
  <rect x="30" y="85" width="220" height="330" fill="#1e2433" stroke="#334155" stroke-width="1.5" rx="8"/>
  <text x="140" y="110" fill="#38bdf8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" text-anchor="middle">
    SomBench Modalities
  </text>

  <!-- WAC Box -->
  <rect x="45" y="125" width="190" height="85" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" rx="6"/>
  <text x="55" y="145" fill="#38bdf8" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif">WAC Family (~100 m/px)</text>
  <text x="55" y="165" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• Reflectance (vis: 5 ch, uv: 2 ch)</text>
  <text x="55" y="180" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• SLDEM2015 (dtm, slope, aspect)</text>
  <text x="55" y="195" fill="#64748b" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif">51.2 km footprint (256x256 px)</text>

  <!-- NAC Box -->
  <rect x="45" y="220" width="190" height="85" fill="#0f172a" stroke="#d97706" stroke-width="1.2" rx="6"/>
  <text x="55" y="240" fill="#fbbf24" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif">NAC Family (~1 m/px)</text>
  <text x="55" y="260" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• Panchromatic (nac: 1 ch)</text>
  <text x="55" y="275" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• Stereo DTM (dtm_3m, slope, aspect)</text>
  <text x="55" y="290" fill="#64748b" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif">512 m footprint (256x256 px)</text>

  <!-- Context Box -->
  <rect x="45" y="315" width="190" height="85" fill="#0f172a" stroke="#10b981" stroke-width="1.2" rx="6"/>
  <text x="55" y="335" fill="#34d399" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Context Sequences</text>
  <text x="55" y="355" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• Optical Metadata (8 fields: angles)</text>
  <text x="55" y="370" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">• Static Map (28 fields: Diviner/LOLA)</text>
  <text x="55" y="385" fill="#64748b" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Binned string sequence tokens</text>

  <!-- Arrow to Patch Embedding -->
  <line x1="250" y1="250" x2="295" y2="250" stroke="#f6c343" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Section 2: FlexiViT Tokenizer & Late Fusion -->
  <rect x="295" y="85" width="230" height="330" fill="#1e2433" stroke="#334155" stroke-width="1.5" rx="8"/>
  <text x="410" y="110" fill="#f6c343" font-size="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" text-anchor="middle">
    FlexiViT &amp; Late Fusion
  </text>

  <rect x="310" y="130" width="200" height="70" fill="#0f172a" stroke="#f6c343" stroke-width="1" rx="6"/>
  <text x="320" y="152" fill="#ffffff" font-size="11" font-weight="bold">FlexiViT Patch Embeddings</text>
  <text x="320" y="170" fill="#94a3b8" font-size="10">• Pretrained: 16x16 (256 patches)</text>
  <text x="320" y="185" fill="#94a3b8" font-size="10">• Fine-tune: 8x8 (1024 patches)</text>

  <rect x="310" y="215" width="200" height="85" fill="#0f172a" stroke="#818cf8" stroke-width="1" rx="6"/>
  <text x="320" y="235" fill="#818cf8" font-size="11" font-weight="bold">9 VQ-VAE Tokenizers (FSQ)</text>
  <text x="320" y="252" fill="#94a3b8" font-size="10">• Levels: (8, 8, 8, 6, 5)</text>
  <text x="320" y="268" fill="#94a3b8" font-size="10">• 15,360 codebook states</text>
  <text x="320" y="284" fill="#94a3b8" font-size="10">• DDPM Diffusion Decoders</text>

  <rect x="310" y="315" width="200" height="85" fill="#0f172a" stroke="#34d399" stroke-width="1" rx="6"/>
  <text x="320" y="335" fill="#34d399" font-size="11" font-weight="bold">Sequence Late Fusion</text>
  <text x="320" y="355" fill="#94a3b8" font-size="10">Tokens concatenated along</text>
  <text x="320" y="370" fill="#94a3b8" font-size="10">sequence axis: [Img | Opt | Ctx]</text>
  <text x="320" y="385" fill="#64748b" font-size="9">Total: ~1,316 tokens (ps16)</text>

  <!-- Arrow to ViT-B Backbone -->
  <line x1="525" y1="250" x2="570" y2="250" stroke="#818cf8" stroke-width="2.5"/>

  <!-- Section 3: Pretrained ViT-B Backbone -->
  <rect x="570" y="85" width="130" height="330" fill="url(#grad-enc)" stroke="#6366f1" stroke-width="1.5" rx="8"/>
  <text x="635" y="115" fill="#ffffff" font-size="13" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">ViT-B</text>
  <text x="635" y="132" fill="#e0e7ff" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Encoder</text>
  <text x="635" y="170" fill="#ffffff" font-size="10" text-anchor="middle">768 Dim</text>
  <text x="635" y="190" fill="#ffffff" font-size="10" text-anchor="middle">12 Layers</text>
  <text x="635" y="210" fill="#ffffff" font-size="10" text-anchor="middle">12 Heads</text>
  <text x="635" y="240" fill="#e0e7ff" font-size="10" text-anchor="middle">TerraMind</text>
  <text x="635" y="255" fill="#e0e7ff" font-size="10" text-anchor="middle">Masked-Token</text>
  <text x="635" y="270" fill="#e0e7ff" font-size="10" text-anchor="middle">Objective</text>
  <text x="635" y="320" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">~86M Params</text>

  <!-- Arrow to Downstream Adaptation -->
  <line x1="700" y1="250" x2="735" y2="250" stroke="#34d399" stroke-width="2.5"/>

  <!-- Section 4: Downstream Applications -->
  <rect x="735" y="85" width="140" height="330" fill="#1e2433" stroke="#334155" stroke-width="1.5" rx="8"/>
  <text x="805" y="110" fill="#34d399" font-size="13" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    Downstream
  </text>
  <text x="805" y="126" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    TerraTorch
  </text>

  <rect x="745" y="145" width="120" height="55" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="4"/>
  <text x="755" y="165" fill="#38bdf8" font-size="10" font-weight="bold">Ice Prospectivity</text>
  <text x="755" y="180" fill="#94a3b8" font-size="9">RMSE: 0.0293 (↓22%)</text>

  <rect x="745" y="210" width="120" height="55" fill="#0f172a" stroke="#fbbf24" stroke-width="1" rx="4"/>
  <text x="755" y="230" fill="#fbbf24" font-size="10" font-weight="bold">Crater Detection</text>
  <text x="755" y="245" fill="#94a3b8" font-size="9">WAC: 0.2581 mAP</text>

  <rect x="745" y="275" width="120" height="55" fill="#0f172a" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="755" y="295" fill="#34d399" font-size="10" font-weight="bold">IMP Segmentation</text>
  <text x="755" y="310" fill="#94a3b8" font-size="9">IoU1: 0.5709</text>

  <rect x="745" y="340" width="120" height="55" fill="#0f172a" stroke="#a855f7" stroke-width="1" rx="4"/>
  <text x="755" y="360" fill="#c084fc" font-size="10" font-weight="bold">Any-to-Any Gen</text>
  <text x="755" y="375" fill="#94a3b8" font-size="9">Cross-modal probe</text>
</svg>
